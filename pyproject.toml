[project]
name = "github-fetch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "K S Abhishek", email = "ksabhishek00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "google-genai>=2.29.0",
    "gradio>=6.30.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
]

[project.scripts]
github-fetch = "github_fetch:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ["py312"]
